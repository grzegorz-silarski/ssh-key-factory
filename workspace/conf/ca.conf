# SSH Certificate Authority key settings.
# Used only when REQUEST_NEW_CA_KEY=true.
# Require a strong passphrase by default (pass -c to ./new-key.sh or -PromptCaPassphrase to ./New-Key.ps1).
KEY_TYPE           = ed25519
KDF_ROUNDS         = 100
COMMENT            = "DevOps SSH CA"
REQUIRE_PASSPHRASE = yes

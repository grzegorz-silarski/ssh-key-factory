# RSA key pair for legacy systems that do not support Ed25519.
# EXPORT_PEM = yes writes a PKCS#8 PEM private key (<name>.pem) and public key (<name>.pub.pem).
KEY_TYPE           = rsa
KEY_BITS           = 4096
KDF_ROUNDS         = 100
COMMENT            = "legacy-integration@example.com"
REQUIRE_PASSPHRASE = no
EXPORT_PEM         = yes

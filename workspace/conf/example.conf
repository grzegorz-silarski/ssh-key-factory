# Plain Ed25519 key pair, e.g. a Git deploy key or CI/CD key.
#
# KEY_TYPE           : ed25519 (recommended) | ecdsa | rsa
# KEY_BITS           : rsa >= 3072 (default 4096) ; ecdsa 256 | 384 (default) | 521 ; ignored for ed25519
# KDF_ROUNDS         : bcrypt KDF rounds (16..1000) used when a passphrase is set
# COMMENT            : key comment (defaults to the configuration name)
# REQUIRE_PASSPHRASE : yes | no (set to yes for interactive user keys)
KEY_TYPE           = ed25519
KDF_ROUNDS         = 100
COMMENT            = "deploy@example.com"
REQUIRE_PASSPHRASE = no

# Ed25519 key pair signed by the SSH CA as a USER certificate (recommended for interactive SSH sessions).
#
# CERT_PRINCIPALS : required comma-separated list of usernames this certificate is valid for
# CERT_VALIDITY   : ssh-keygen -V format (defaults to +12w for user certs; 'forever'/'always' is rejected)
# CERT_OPTIONS    : space-separated allowlisted ssh-keygen -O options
# CERT_IDENTITY   : key identity logged by sshd (defaults to the configuration name)
# CERT_SERIAL     : optional numeric serial (defaults to a random 56-bit serial for KRL revocation)
KEY_TYPE           = ed25519
KDF_ROUNDS         = 100
COMMENT            = "jane.doe@example.com"
REQUIRE_PASSPHRASE = yes
EXPORT_BASE64      = no
SIGN_WITH_CA       = yes
CERT_TYPE          = user
CERT_IDENTITY      = "jane.doe@example.com"
CERT_PRINCIPALS    = "jane,deploy"
CERT_VALIDITY      = +12w
CERT_OPTIONS       = "no-x11-forwarding no-agent-forwarding"

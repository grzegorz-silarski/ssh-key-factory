# Ed25519 host key signed by the SSH CA as a HOST certificate.
# Host keys must remain unencrypted so sshd can load them on boot.
# CERT_PRINCIPALS must list the host names / IPs clients use to connect.
KEY_TYPE           = ed25519
COMMENT            = "server01.example.com"
REQUIRE_PASSPHRASE = no
EXPORT_PPK         = no
SIGN_WITH_CA       = yes
CERT_TYPE          = host
CERT_IDENTITY      = "server01.example.com"
CERT_PRINCIPALS    = "server01.example.com,server01,10.0.0.10"
CERT_VALIDITY      = +52w
